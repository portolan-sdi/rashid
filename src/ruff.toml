# Production API ownership; the root config also bans imperative pytest.xfail in tests.
extend = "../pyproject.toml"

[lint.flake8-tidy-imports.extend-banned-api]
"urllib.parse.urljoin" = { msg = "Use rashid_core._href for URL interpretation." }
"urllib.parse.urlsplit" = { msg = "Use rashid_core._href.split_href." }
"urllib.parse.urlparse" = { msg = "Use rashid_core._href.split_href." }
"urllib.request.Request" = { msg = "Use rashid_core._store.request for the shared HTTPS and User-Agent policy." }
"urllib.request.urlopen" = { msg = "Use rashid_core._store for HTTP transport." }
"json.loads" = { msg = "Use rashid_core._json.loads for counted JSON parsing." }
"json.load" = { msg = "Read bytes and use rashid_core._json.loads." }
"orjson.loads" = { msg = "Use rashid_core._json.loads for counted JSON parsing." }
"obstore.store.HTTPStore" = { msg = "Use rashid_core._store for shared object stores." }
"obstore.store.S3Store" = { msg = "Use rashid_core._store.list_objects for anonymous bucket listing." }
"obstore.store.GCSStore" = { msg = "Use rashid_core._store.list_objects for anonymous bucket listing." }
"obstore.store.AzureStore" = { msg = "Use rashid_core._store.list_objects for anonymous bucket listing." }
"glob.glob" = { msg = "Use rashid_core.data.formats._files for partition enumeration." }
"pyarrow.parquet.ParquetFile" = { msg = "Use rashid_core.data.formats._files for shared, counted readers." }
"rasterio.open" = { msg = "Use rashid_core.data.formats._files for shared, counted readers." }
"importlib.resources.files" = { msg = "Use rashid_core._package.schemas for bundled schemas." }
"importlib.metadata.version" = { msg = "Use rashid_core._package.version for distribution metadata." }
"importlib.import_module" = { msg = "Use static imports so dependency contracts can trace them." }
