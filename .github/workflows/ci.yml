# Thin caller — synced from portolan-sdi/portolan-ops (ci/python-package/).
# CI logic lives in ops' reusable-python-ci.yml; change it there.
#
# This file carries repo-specific inputs, so it is not managed by ops sync.
# The workflow it calls is, through the @v1 tag.
#
# security-audit.yml stays: it files a tracking issue on pip-audit
# findings, which the shared security job does not do
# (portolan-sdi/portolan-ops#14).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No branch filter. A pull request aimed anywhere else still runs
    # these checks; without that, a stacked pull request shows green
    # having run none of them.
  schedule:
    # Distinct minute so the fleet doesn't fire at once.
    - cron: "19 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # v1 is a moving major tag. Compatible changes arrive when ops moves
    # it; a breaking change ships as v2 and reaches this repo as a
    # Dependabot PR.
    uses: portolan-sdi/portolan-ops/.github/workflows/reusable-python-ci.yml@v1.14.0
    permissions:
      contents: read
      # The reusable test job requests this for Codecov OIDC even when the
      # upload is off, and a caller must grant what the called workflow
      # requests.
      id-token: write
    with:
      # The shared default still includes 3.10. rashid requires 3.11 or later.
      python-versions: '["3.11", "3.12", "3.13"]'
      test-command: >-
        uv run pytest -n 8 --cov=$COVERAGE_TARGET
        --cov-report=xml --cov-report=term-missing
      # rashid reads and writes files, and path handling is where Windows
      # breaks. The shared default is ubuntu alone.
      os: '["ubuntu", "macos", "windows"]'
      # The geospatial stack is a core dependency now; no extra needed.
      # Package path, not package name: coverage accepts either, and wily
      # reads this as a directory to walk.
      coverage-target: src/rashid
      bandit-target: src/rashid
      # rashid has no Codecov project. The upload step fails the run on
      # error, so leaving this on would break every build. The 90%
      # diff-cover gate still runs.
      codecov: false

  guardrail-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Prove guardrails reject injected faults
        run: uv run python scripts/gate_selftest.py
