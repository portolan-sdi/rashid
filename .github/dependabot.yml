version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    ignore:
      # v1 is a moving major tag by design, so a pin defeats it. Pinning it to
      # v1.1.0 broke repo-checks outright: the reusable workflow did not exist
      # at that tag.
      - dependency-name: portolan-sdi/portolan-ops/.github/workflows/reusable-repo-checks.yml

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
