[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rashid-core"
version = "0.4.0"
description = "Validator and linter for Portolan catalogs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Portolan contributors" }]
dependencies = [
    "click>=8.4",
    "jsonschema>=4.26",
    # Rust screening precedes jsonschema; its registry needs the bundled meta-schemas.
    "jsonschema-rs>=0.58",
    # Already a jsonschema dependency; declared here for our direct registry import.
    "jsonschema-specifications>=2023.3.6",
    "referencing>=0.30",
    "orjson>=3.11",
    "obstore>=0.9",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
data = [
    "numpy>=1.24",
    # 21 first exposes native GeospatialStatistics. Consumers cap below 25 for the
    # abseil ABI break, so a >=25 floor would prevent joint installation.
    "pyarrow>=21",
    "rasterio>=1.4.4",
    "rio-cogeo>=6",
    "pyproj>=3.7.1",
    # Item-mirror geometry comparison uses WKB and GeoJSON; 2.1 is the supported series.
    "shapely>=2.1",
]

[project.urls]
Homepage = "https://github.com/portolan-sdi/rashid"

[dependency-groups]
dev = [
    "rashid",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-xdist>=3.8",
    "diff-cover>=10.4",
    "ruff>=0.17.3",
    "mypy>=2.3",
    "import-linter>=2.13",
    "prek>=0.5.11",
    "hypothesis>=6.140",
    "commitizen>=4.16",
    "codespell>=2.4.3",
    "vulture>=2.16",
    "deptry>=0.25",
    "bandit>=1.9",
    "pip>=26.1",
    "pip-audit>=2.10",
    "trustme>=1.2.1",
]

[tool.uv.workspace]
members = ["meta/rashid"]

[tool.uv.sources]
rashid = { workspace = true }
rashid-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rashid_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored spec fixtures stay byte-identical; ruff 0.17 also formats Markdown code fences.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
preview = true
explicit-preview-rules = true
extend-select = [
    "C901", "SIM", "FURB", "PIE", "RET", "ARG", "ERA", "TID251", "PERF", "PGH004",
    "PT", "RUF", "PL",
    # Preview rules opt in by name: PL size limits, plus low-noise checks.
    "PLR0914", "PLR0916", "PLR0917", "PLR1702", "PLR6104", "PLW1514", "RUF052",
]
# Lazy imports are deliberate; tests/unit/test_import_budget.py enforces them.
extend-ignore = ["PLC0415"]

# Characters quoted from the spec and its sources: the × of "512×512", the en dash of
# ranges such as "2–10" and in docs/rules.md, and the fullwidth solidus a test feeds
# to the href parser.
allowed-confusables = ["×", "–", "／"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
max-nested-blocks = 4
max-args = 5
max-positional-args = 5
max-bool-expr = 5
max-locals = 15
max-returns = 6

[tool.ruff.lint.flake8-pytest-style]
# rashid defines no warning classes, so PT030 needs no warns-extend-require-match-for.
raises-extend-require-match-for = [
    "rashid_core.remote.FetchError",
    "rashid_core._store.StoreError",
    "rashid_core.registry.RegistryError",
]

[tool.ruff.lint.isort]
known-first-party = ["rashid_core"]

[tool.ruff.lint.per-file-ignores]
# Rules share check(node, graph); many rules do not need the graph context.
"src/rashid_core/rules/*.py" = ["ARG002"]
# Test doubles retain protocol method and callback signatures. Keep ARG001 on for fixtures.
# Expected values in assertions are clearest as literals.
"tests/**" = ["ARG002", "ARG005", "PLR2004"]
# Developer scripts compare against literal exit codes and thresholds.
"scripts/**" = ["PLR2004"]
# Dedicated owners; reasons and live matches are checked in guardrail_exemptions.json.
"src/rashid_core/_package.py" = ["TID251"]
"src/rashid_core/_href.py" = ["TID251"]
"src/rashid_core/_store.py" = ["TID251"]
"src/rashid_core/_json.py" = ["TID251"]
"src/rashid_core/data/formats/_files.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.xfail" = { msg = "use @pytest.mark.xfail(strict=True) keyed to an open issue and listed in the ledger" }

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/rashid_core"]

# jsonschema and jsonschema-specifications ship no py.typed marker.
[[tool.mypy.overrides]]
module = ["jsonschema.*", "jsonschema_specifications.*"]
ignore_missing_imports = true

# The data-pass geospatial stack (rashid-core[data]) ships no usable type information.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "rasterio.*", "pyproj.*", "rio_cogeo.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = [
    "--tb=short",
    "--strict-markers",
    "--cov=rashid_core",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "unit: fast, isolated tests",
    "integration: end-to-end validation runs",
    "network: exercises real validators (needs schemas.stacspec.org / schemas.portolan-sdi.org)",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "rashid_core"
include_external_packages = true

# Node annotations in _href do not create a runtime dependency on catalog.
# Import-linter exposes this option per configuration, rather than per contract.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "package-layers"
name = "package imports follow exhaustive layers"
type = "layers"
containers = ["rashid_core"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "api",
    "runner",
    "schema | structural | extensions | remote | live | data",
    "_jsonschema",
    "report",
    "registry",
    "rules",
    "_media",
    "_profile | _stac | rule",
    "catalog | config",
    "_store",
    "_href | _http | _json",
    "_trace | _multihash | _spdx | ids | model | _package",
]

[[tool.importlinter.contracts]]
id = "formats-only-geo"
name = "only optional formats may import the geospatial stack"
type = "protected"
protected_modules = ["pyarrow", "rasterio", "pyproj", "rio_cogeo", "shapely", "numpy"]
allowed_importers = ["rashid_core.data.formats"]

[[tool.importlinter.contracts]]
id = "cli-only-click"
name = "only the cli may import click"
type = "protected"
protected_modules = ["click"]
allowed_importers = ["rashid_core.cli"]

[[tool.importlinter.contracts]]
id = "formats-entry-point"
name = "only the data entry point may import optional formats"
type = "protected"
protected_modules = ["rashid_core.data.formats", "rashid_core.data.formats.**"]
# Exact entry module; treating rashid_core.data as a package would allow every reader.
as_packages = false
allowed_importers = ["rashid_core.data", "rashid_core.data.formats.**"]

[[tool.importlinter.contracts]]
id = "rules-no-network"
name = "metadata rules must not import transport"
type = "forbidden"
source_modules = ["rashid_core.rules"]
forbidden_modules = ["rashid_core._store"]

[[tool.importlinter.contracts]]
id = "rules-independent"
name = "metadata rule modules must be independent"
type = "independence"
modules = [
    "rashid_core.rules.assets",
    "rashid_core.rules.bbox",
    "rashid_core.rules.catalogs",
    "rashid_core.rules.classification",
    "rashid_core.rules.collections",
    "rashid_core.rules.conformance",
    "rashid_core.rules.files",
    "rashid_core.rules.item_mirror",
    "rashid_core.rules.license",
    "rashid_core.rules.links",
    "rashid_core.rules.partitions",
    "rashid_core.rules.provenance",
    "rashid_core.rules.providers",
    "rashid_core.rules.temporal",
    "rashid_core.rules.titles",
    "rashid_core.rules.versions",
    "rashid_core.rules.viz",
]

[[tool.importlinter.contracts]]
id = "rules-only-registry"
name = "only the registry may import metadata rules"
type = "protected"
protected_modules = ["rashid_core.rules"]
allowed_importers = ["rashid_core.registry"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.0"
version_files = [
    "pyproject.toml:^version",
    "meta/rashid/pyproject.toml:^version",
    'meta/rashid/pyproject.toml:rashid-core\[data\]==',
]
tag_format = "v$version"
annotated_tag = true
# uv.lock records this package's own version, and version_files rewrites
# every line matching its pattern, which in a lock file is every package.
# Relocking after pyproject.toml is bumped but before the commit keeps the
# two in step, and cz stages what the hook writes.
pre_bump_hooks = ["uv lock"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true

[tool.codespell]
skip = ".git,uv.lock,.venv,.mypy_cache,.ruff_cache,.pytest_cache,.cache"
# "unparseable" is a valid English variant used in rule messages, and "zar" is
# the three-letter family of the Zarr checks (PTL-ZAR-00x), which the check id
# format fixes at three letters.
ignore-words-list = "unparseable,zar"
check-filenames = true

[tool.vulture]
min_confidence = 80
paths = ["src/rashid_core", "tests", "scripts"]
sort_by_size = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.deptry]
known_first_party = ["rashid_core"]
# .claude holds generated Claude Code worktrees, each with its own .venv.
exclude = [".venv", "tests", ".claude", ".cache"]

[tool.deptry.package_module_name_map]
# rio-cogeo installs as the `rio_cogeo` import package.
rio-cogeo = ["rio_cogeo"]

[tool.deptry.per_rule_ignores]
# zoneinfo loads tzdata implicitly when Windows has no system IANA database.
DEP002 = ["tzdata"]
