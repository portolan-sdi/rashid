[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rashid"
version = "0.1.0"
description = "Validator and linter for Portolan catalogs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Portolan contributors" }]
# The data pass reads asset bytes to verify checksum, size, format, and extent —
# the core of what a catalog validator is for — so its geospatial stack is a
# core dependency and the pass runs by default. The import-linter contracts
# keep `import rashid` cheap: the heavy imports stay confined to
# rashid.data.checks and load only when the pass runs.
#
# Floors sit at the newest release that still resolves on Python 3.10; rasterio,
# rio-cogeo, and pyproj all dropped 3.10 in their latest majors, and 3.11+ picks
# those up through the lock. pyarrow is the exception: 21 is the oldest release
# whose reader exposes native GeospatialStatistics (checks._native_bboxes
# feature-detects it either way), and consumers cap pyarrow below 25 over an
# abseil ABI break, so a >=25 floor would make rashid uninstallable next to them
# (#36; also fixed on main by #49 — the floors agree whichever merges first).
dependencies = [
    "click>=8.4",
    "jsonschema>=4.26",
    "referencing>=0.30",
    "pyarrow>=21",
    "rasterio>=1.4.4",
    "rio-cogeo>=6",
    "pyproj>=3.7.1",
]

[project.optional-dependencies]
# Back-compat: the data pass's stack moved into the core dependencies, so the
# extra is an intentional no-op; `pip install rashid[data]` keeps working.
data = []

[project.urls]
Homepage = "https://github.com/portolan-sdi/rashid"

[project.scripts]
rashid = "rashid.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-xdist>=3.8",
    "diff-cover>=10.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "import-linter>=2.13",
    "pre-commit>=4.6",
    "commitizen>=4.16",
    "codespell>=2.4.3",
    "vulture>=2.16",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "deptry>=0.25",
    "bandit>=1.9",
    "pip>=26.1",
    "pip-audit>=2.10",
    "mutmut>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rashid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rashid"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/rashid"]

# jsonschema ships no py.typed marker; stubs live in the separate types-jsonschema.
[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

# The data-pass geospatial stack (rashid[data]) ships no usable type information.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "rasterio.*", "pyproj.*", "rio_cogeo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = [
    "--tb=short",
    "--strict-markers",
    "--cov=rashid",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "unit: fast, isolated tests",
    "integration: end-to-end validation runs",
    "network: exercises real validators (needs schemas.stacspec.org / schemas.portolan-sdi.org)",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "rashid"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "validation core must not import a CLI framework"
type = "forbidden"
source_modules = [
    "rashid.model",
    "rashid.catalog",
    "rashid.rule",
    "rashid.runner",
    "rashid.config",
    "rashid.rules",
    "rashid.live",
]
forbidden_modules = ["click"]

# Only rashid.data.checks may touch the geospatial stack; the core validator and
# the data-pass glue (entry point, byte reader) stay stdlib-only, so `import
# rashid` never pulls pyarrow/rasterio/pyproj. The lazy rashid.data -> checks edge is
# severed here because it fires only inside default_validator(), on demand; the
# runner -> rashid.data chain then still catches any direct geo import in the glue.
# rashid.data itself is not a source module: it is a package, so listing it would
# pull in rashid.data.checks (the one module allowed to import the stack).
[[tool.importlinter.contracts]]
name = "only rashid.data.checks may import the geospatial stack"
type = "forbidden"
source_modules = [
    "rashid.model",
    "rashid.catalog",
    "rashid.rule",
    "rashid.runner",
    "rashid.config",
    "rashid.rules",
    "rashid.schema",
    "rashid.structural",
    "rashid.cli",
    "rashid.live",
    "rashid.data.reader",
]
forbidden_modules = ["pyarrow", "rasterio", "pyproj", "rio_cogeo"]
ignore_imports = ["rashid.data -> rashid.data.checks"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true

[tool.codespell]
skip = ".git,uv.lock,.venv,.mypy_cache,.ruff_cache,.pytest_cache,mutants"
# "unparseable" is a valid English variant used in rule messages
ignore-words-list = "unparseable"
check-filenames = true

[tool.vulture]
min_confidence = 80
paths = ["src/rashid", "tests"]
sort_by_size = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.deptry]
known_first_party = ["rashid"]
exclude = [".venv", "tests", "mutants"]

[tool.deptry.package_module_name_map]
# rio-cogeo installs as the `rio_cogeo` import package.
rio-cogeo = ["rio_cogeo"]

[tool.mutmut]
source_paths = ["src/rashid/"]
# --no-cov drops the coverage overhead and the global --cov-fail-under gate
# from addopts; mutmut 3 runs pytest in-process, so extra args must go here
# rather than in a `runner` setting (which mutmut 3 ignores).
pytest_add_cli_args = ["--no-cov", "--tb=short"]
pytest_add_cli_args_test_selection = ["tests/"]
